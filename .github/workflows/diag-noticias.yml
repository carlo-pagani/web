name: Diagnóstico de noticias

on:
  push:
    branches: [diag-noticias]

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/actualizar_datos.py > diag-noticias.txt 2>&1 || true
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json diag-noticias.txt && git commit -qm "Resultado [skip ci]" && git push origin HEAD:diag-noticias
