# Prueba temporal (aprobada por Carlo el 18 nov 2026): comprueba si el contador
# de visitas de Cloudflare carga y envía la visita. Se borra al terminar.
name: Prueba del contador de visitas
on:
  push:
    branches: [claude/project-thread-y1smji]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Abre la web como visitante
        shell: python
        run: |
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for url in ["https://carlo-pagani.com/", "https://carlo-pagani.com/consulta-express/"]:
                      ctx = await b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36")
                      pg = await ctx.new_page()
                      log = []
                      pg.on("requestfinished", lambda r: log.append(r))
                      pg.on("requestfailed", lambda r: print("FALLA", r.method, r.url, r.failure))
                      pg.on("console", lambda m: print("CONSOLA", m.type, m.text))
                      await pg.goto(url, wait_until="load")
                      await pg.wait_for_timeout(4000)
                      html = await pg.content()
                      print("==", url, "| etiqueta en el HTML:", "beacon.min.js" in html)
                      await pg.goto("about:blank")
                      await pg.wait_for_timeout(3000)
                      for r in log:
                          if "cloudflareinsights" in r.url:
                              resp = await r.response()
                              print("CF", r.method, r.url[:90], resp.status if resp else None)
                      await ctx.close()
                  await b.close()
          asyncio.run(main())
