name: Desplegar asistente con IA

# Publica worker/ en Cloudflare y deja su dirección en data/asistente.json, que la web lee al abrir el análisis exprés.
# Necesita tres secretos del repositorio: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y ANTHROPIC_API_KEY.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/asistente.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asistente
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén las claves
        id: claves
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_CUENTA" ] && [ -n "$ANTHROPIC" ]; then
            echo "listas=si" >> "$GITHUB_OUTPUT"
          else
            echo "listas=no" >> "$GITHUB_OUTPUT"
            echo "Faltan secretos del repositorio; el asistente no se despliega todavía."
          fi

      - uses: actions/setup-node@v4
        if: steps.claves.outputs.listas == 'si'
        with:
          node-version: "20"

      - name: Instalar dependencias
        if: steps.claves.outputs.listas == 'si'
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Desplegar en Cloudflare
        if: steps.claves.outputs.listas == 'si'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx wrangler deploy | tee despliegue.txt
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Guardar la dirección para la web
        if: steps.claves.outputs.listas == 'si'
        run: |
          DIRECCION=$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' worker/despliegue.txt | head -1)
          if [ -z "$DIRECCION" ]; then echo "Cloudflare no devolvió la dirección del asistente"; exit 1; fi
          printf '{\n "url": "%s/guia"\n}\n' "$DIRECCION" > data/asistente.json
          cat data/asistente.json
          if [ -n "$(git status --porcelain data/asistente.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/asistente.json
            git commit -m "Activa el asistente con IA del análisis exprés"
            git pull --rebase origin main
            git push
          fi
